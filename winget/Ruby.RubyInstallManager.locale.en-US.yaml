PackageIdentifier: Ruby.RubyInstallManager
PackageVersion: 0.1.0
PackageLocale: en-US
Publisher: Ruby Core Team
PublisherUrl: https://www.ruby-lang.org/
PackageName: Ruby Install Manager
PackageUrl: https://github.com/ruby/rbmanager
License: BSD-2-Clause
ShortDescription: Version manager for the official Ruby mswin binary packages
Description: |-
  rbmanager installs and manages the official Ruby mswin binary packages
  on Windows. It downloads a relocatable binary package, extracts it under
  %LOCALAPPDATA%\Ruby, and switches the active version through an
  NTFS junction, with no elevation required.
Moniker: rubyinstallmanager
